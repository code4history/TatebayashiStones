name = "tatebayashi-stones-image-processor"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Account ID - これは公開しても安全です
account_id = "61f248de47f07bdbf3dd2133a5378e64"

# 公開可能な環境変数
[vars]
CORS_ORIGIN = "*" # Change to your specific origin in production
PROJECT_PREFIX = "tatebayashi_stones" # プロジェクト名のプレフィックス
IMAGES_DELIVERY_URL = "https://imagedelivery.net/nPUB0SeeEPqgGoF9i-9JRg" # アカウントハッシュを含むURL

# Routes for custom domain (必要に応じて設定)
# [[routes]]
# pattern = "your-custom-domain.com/*"
# zone_id = "your-zone-id"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Secrets that should be set via wrangler secret put or dashboard
# AUTH_TOKEN - Authentication token for API access
# CLOUDFLARE_IMAGES_API_TOKEN - Cloudflare Images API token
# Run: 
# wrangler secret put AUTH_TOKEN
# wrangler secret put CLOUDFLARE_IMAGES_API_TOKEN